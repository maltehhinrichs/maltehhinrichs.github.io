name: Update CV and JMP from Mega

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  update-cv:
    name: Update CV and JMP from Mega
    runs-on: ubuntu-latest

    # Necessary permission!
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install MEGAcmd
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl gnupg apt-transport-https lsb-release
          VERSION_ID=$(lsb_release -rs)
          curl -fsSL "https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/Release.key" | \
            sudo gpg --dearmor -o /usr/share/keyrings/mega-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/mega-archive-keyring.gpg] https://mega.nz/linux/repo/xUbuntu_${VERSION_ID}/ ./" | \
            sudo tee /etc/apt/sources.list.d/megacmd.list
          sudo apt-get update
          sudo apt-get install -y megacmd

      - name: Download CV files from MEGA
        run: |
          set -e
          mkdir -p /tmp/cv-download
          mega-get "${{ secrets.MEGA_FOLDER }}" /tmp/cv-download
          find /tmp/cv-download -name "Academic_CV.qmd" -exec cp {} files/cv-latest.md \;
          find /tmp/cv-download -name "Academic_CV.pdf" -exec cp {} files/cv-latest.pdf \;

      - name: Download JMP file from MEGA
        run: |
          set -e
          mkdir -p /tmp/jmp-download
          mega-get "${{ secrets.MEGA_JMP }}" /tmp/jmp-download

          JMP_FILE=$(find /tmp/jmp-download -type f -iname "*.pdf" | head -n 1)
          if [ -z "$JMP_FILE" ]; then
            echo "No JMP PDF was downloaded from MEGA_JMP."
            exit 1
          fi

          cp "$JMP_FILE" files/Scotland_full.pdf

      - name: Commit and push updated CV and JMP
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add files/cv-latest.md files/cv-latest.pdf files/Scotland_full.pdf

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update CV and JMP from Mega"
            git push
          fi
